<!DOCTYPE html>
<html>
<head>
    <title>BloodConnect - AI Donor Matching</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #c62828;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            background: #c62828;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f8e9;
        }

        .donor {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-left: 5px solid #c62828;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🩸 AI Donor Matching</h1>

    <label>Required Blood Group</label>

    <select id="blood_group">
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
    </select>

    <label>Hospital Latitude</label>
    <input type="number" id="latitude" step="any" value="14.6819">

    <label>Hospital Longitude</label>
    <input type="number" id="longitude" step="any" value="78.9888">

    <button onclick="findDonors()">
        Find Suitable Donors
    </button>

    <div id="result"></div>

</div>

<script>

async function findDonors() {

    const bloodGroup =
        document.getElementById("blood_group").value;

    const latitude =
        document.getElementById("latitude").value;

    const longitude =
        document.getElementById("longitude").value;

    const result =
        document.getElementById("result");

    result.innerHTML = "Searching for suitable donors...";

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/match-donors",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    blood_group: bloodGroup,
                    latitude: latitude,
                    longitude: longitude
                })
            }
        );

        const data = await response.json();

        if (data.total_matches === 0) {

            result.innerHTML =
                "<h3>No suitable donors found.</h3>";

            return;
        }

        let html =
            "<h3>Recommended Donors</h3>";

        data.recommended_donors.forEach(function(donor) {

            html += `
                <div class="donor">

                    <b>👤 ${donor.name}</b><br>

                    🩸 Blood Group:
                    ${donor.blood_group}<br>

                    📍 Distance:
                    ${donor.distance_km} km<br>

                    ⭐ Match Score:
                    ${donor.match_score}/100<br>

                    ✅ ${donor.status}

                </div>
            `;

        });

        result.innerHTML = html;

    } catch (error) {

        result.innerHTML =
            "<h3>❌ Could not connect to Flask server.</h3>" +
            "<p>Make sure donor_matching.py is running.</p>";
    }
}

</script>

</body>
</html>
